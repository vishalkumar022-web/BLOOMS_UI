<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooms - Feed</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- 🟢 TOP NAVBAR -->
    <nav class="navbar">
        <!-- Naya wrapper taaki sab paas-paas rahe -->
        <div class="nav-content">
            <div class="nav-left">
                <h1 class="logo"><i class="fa-solid fa-leaf"></i> Blooms</h1>
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search blogs...">
                </div>
            </div>
            
            <div class="nav-right">
                <!-- ✅ FIX: Ab ye aage naye pages par le jayenge -->
                <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-home"></i><span>Home</span></a>
                <a href="categories.html" class="nav-item"><i class="fa-solid fa-layer-group"></i><span>Categories</span></a>
                <a href="subcategories.html" class="nav-item"><i class="fa-solid fa-tags"></i><span>Subcategories</span></a>
                <a href="ai-chat.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>AI Chat</span></a>
                <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
                
                <div class="nav-divider"></div>

                <button id="profile-btn" class="nav-item btn-style"><i class="fa-solid fa-user-circle"></i><span>Profile</span></button>
                <button id="logout-btn" class="nav-item btn-style logout"><i class="fa-solid fa-sign-out-alt"></i><span>Logout</span></button>
            </div>
        </div>
    </nav>

    <!-- 🟢 MAIN LAYOUT -->
    <div class="main-container">
        
        <!-- 🟡 LEFT SIDEBAR: BADA PROFILE CARD -->
        <div class="left-sidebar">
            <div class="profile-card">
                <!-- Background Banner thoda lamba (taller) kiya -->
                <div class="profile-background"></div>
                
                <!-- ✅ FIX: Badi aur Gol Image. 'onerror' lagaya hai ki agar photo fail ho toh default dikh jaye -->
                <img id="sidebar-profile-img" src="https://ui-avatars.com/api/?name=User&background=random" onerror="this.src='https://ui-avatars.com/api/?name=U&background=0a66c2&color=fff'" alt="Profile Image" class="profile-main-img">
                
                <!-- User Details -->
                <div class="profile-info">
                    <h3 id="sidebar-name">Loading...</h3>
                    <p id="sidebar-role" class="text-muted">Loading role...</p>
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                    <p id="sidebar-userid" class="text-small">ID: ---</p>
                </div>
            </div>
        </div>

        <!-- 🟡 MIDDLE FEED: BLOGS -->
        <div class="feed-container">
            <div id="loading" class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading your feed...
            </div>
            <div id="blog-feed"></div>
        </div>

        <!-- 🟡 RIGHT SIDEBAR: TRENDING TOPICS (Wikipedia Linked) -->
        <div class="right-sidebar">
            <div class="trending-box">
                <h3>LinkedIn News</h3>
                <p class="trending-subtitle">Trending Topics on Blooms</p>
                
                <a href="https://en.wikipedia.org/wiki/Technology" target="_blank" class="trending-item">
                    <span class="dot">•</span> Technology & Future
                </a>
                <a href="https://en.wikipedia.org/wiki/Artificial_intelligence" target="_blank" class="trending-item">
                    <span class="dot">•</span> Artificial Intelligence
                </a>
                <a href="https://en.wikipedia.org/wiki/Web_development" target="_blank" class="trending-item">
                    <span class="dot">•</span> Web Development
                </a>
                <a href="https://en.wikipedia.org/wiki/Software_engineering" target="_blank" class="trending-item">
                    <span class="dot">•</span> Software Engineering
                </a>
            </div>
        </div>

    </div>

    <script src="dashboard.js"></script>
</body>
</html>
