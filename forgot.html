<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooms - Forgot Password</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN PAGE: Jisme user sirf email dalega -->
    <div class="glass-container">
        <!-- Back to Login Button -->
        <div class="top-link" style="text-align: left;">
            <a href="login.html" style="margin-left: 0;"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>

        <h1>blooms.in</h1>
        <h2>FORGOT PASSWORD</h2>
        <p style="text-align: center; font-size: 14px; margin-bottom: 20px;">Enter your registered email address to receive an OTP.</p>

        <form id="forgot-form">
            <div class="form-group">
                <label>Email Address</label>
                <!-- Yahan user apna email dalega -->
                <input type="email" id="forgot-email" placeholder="Enter your email" required>
            </div>

            <button type="submit">Send OTP</button>
        </form>
    </div>

    <!-- POP-UP (MODAL): Ye shuru me chhupa rahega -->
    <div class="modal-overlay" id="otp-modal">
        <div class="glass-container modal-content">
            <!-- X (Close) Button -->
            <span class="close-btn" id="close-modal">&times;</span>

            <h2>RESET PASSWORD</h2>
            <p style="text-align: center; font-size: 14px; margin-bottom: 20px;">Enter the OTP sent to your email and create a new password.</p>

            <form id="reset-form">
                <!-- 1. Email (Ye JS apne aap bhar dega aur edit nahi karne dega) -->
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reset-email" readonly required>
                </div>

                <!-- 2. OTP (Swagger screenshot ke according) -->
                <div class="form-group">
                    <label>Enter OTP</label>
                    <input type="text" id="reset-otp" placeholder="Enter 6-digit OTP" required>
                </div>

                <!-- 3. New Password (Swagger screenshot ke according) -->
                <div class="form-group password-container">
                    <label>New Password</label>
                    <input type="password" id="reset-new-password" placeholder="Create new password" required>
                    <i class="fa-solid fa-eye eye-icon" id="toggle-reset-password"></i>
                </div>

                <button type="submit">Change Password</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
