<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blooms - Blog Management System Login">
    <meta property="og:title" content="Blooms Login">
    <meta property="og:description" content="Login to your Blooms account">
    <title>Blooms - Login</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://ui-avatars.com" crossorigin>

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <!-- Top Link -->
        <div class="top-link">
            <span>New user?</span> <a href="register.html">Register Now</a>
        </div>

        <h1>blooms.in</h1>
        <h2>LOGIN</h2>

        <form id="login-form">
            <div class="form-group">
                <label for="login-phone">Enter your Phone Number</label>
                <input type="tel" id="login-phone" placeholder="1234567890" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="........" required>
                <!-- NAYA: Login ke liye bhi Eye Icon -->
                <i class="fa-solid fa-eye eye-icon" id="toggle-login-password" role="button" aria-label="Toggle password visibility" tabindex="0"></i>
            </div>

            <button type="submit" class="login-button">Login Now</button>
            <button type="button" class="forgotten-password">Forgot Password?</button>
        </form>
    </div>

    <!-- Yahan bhi wahi same JS file kaam karegi -->
    <script src="script.js"></script>

</body>
</html>
