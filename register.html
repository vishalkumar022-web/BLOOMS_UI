<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooms - Register</title>

    <!-- Font Awesome CDN Link - Yahi se saare naye icons aayenge -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <!-- Top Link -->
        <div class="top-link">
            <span>Already registered?</span> <a href="login.html">Login Here</a>
        </div>

        <h1>blooms.in</h1>
        <h2>REGISTER</h2>

        <!-- Image Preview -->
        <img id="preview-img" class="profile-preview" src="https://via.placeholder.com/100?text=No+Image" alt="Profile Preview">

        <form id="register-form">

            <div class="form-group">
                <label>User ID</label>
                <input type="text" id="reg-userid" placeholder="Enter your user ID" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Create a username" required>
            </div>

            <div class="form-group" >
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Profile Image URL</label>
                <input type="url" id="reg-profile-url" placeholder="Paste image link here" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Create a password" required>
                <!-- NAYA: Font awesome ka solid Eye Icon -->
                <i class="fa-solid fa-eye eye-icon" id="toggle-reg-password"></i>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select id="reg-role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <button type="submit" class="submit-btn">Create Account</button>
        </form>
    </div>

    <!-- JS file connect ho rahi hai -->
    <script src="script.js"></script>
        
</body>
</html>
